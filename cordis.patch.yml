# ============================================================================
# dsh-video-digest 的 bundle patch —— 把 video-digest 技能挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   DSH 启动时按 bundle 层栈叠加各插件的 patch 组成配置树。本文件就是本插件
#   这一层：往树里插入一行插件。
#
# 【约定】
#   - insert：添加插件行（entry）；id 全局唯一且与包名一致，商城预检按它比对
#   - name: 'dsh-video-digest' 解析到本包入口 lib/index.js（宿主半侧）
#   - 插件行那一行（"id: 值"）不要写行尾注释，商城预检的正则会抓不到 entry ID
#   - 本插件不注册工具、没有浏览器半侧，纯宿主侧技能注册
#
# ============================================================================

- insert:
    - id: dsh-video-digest
      name: 'dsh-video-digest'
